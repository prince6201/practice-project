name: CI

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Check Java
      - name: Check Java version
        run: |
          java -version
          ./mvnw -version

      # 4. Build
      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      # 5. Create deployment directories
      - name: Prepare deployment directories
        run: |
          sudo mkdir -p /opt/demo-service
          sudo mkdir -p /opt/demo-service-verify

      # 6. Copy Production JAR
      - name: Deploy Production
        run: |
          sudo cp target/*.jar /opt/demo-service/app.jar

          echo "✅ Production JAR copied successfully"

          nohup java -jar /opt/demo-service/app.jar \
            --server.port=8080 \
            > /tmp/demo-service.log 2>&1 &

          echo $! | sudo tee /opt/demo-service/app.pid

      # 7. Wait for Production
      - name: Verify Production
        run: |
          for i in {1..20}; do
            if curl -f http://localhost:8080/api/hello; then
              echo "✅ demo-service is up"
              break
            fi

            echo "⏳ Waiting for demo-service... attempt $i"
            sleep 3
          done

          curl -f http://localhost:8080/api/hello

      # 8. Copy Verification JAR
      - name: Deploy Verification Service
        run: |
          sudo cp target/*.jar /opt/demo-service-verify/app.jar

          echo "✅ Verification JAR copied successfully"

          nohup java -jar /opt/demo-service-verify/app.jar \
            --server.port=8081 \
            > /tmp/demo-service-verify.log 2>&1 &

          echo $! | sudo tee /opt/demo-service-verify/app.pid

      # 9. Wait for Verification
      - name: Verify Verification Service
        run: |
          for i in {1..20}; do
            if curl -f http://localhost:8081/api/hello; then
              echo "✅ demo-service-verify is up"
              break
            fi

            echo "⏳ Waiting for verification service... attempt $i"
            sleep 3
          done

          curl -f http://localhost:8081/api/hello

      # 10. Show application logs
      - name: Show application logs
        if: always()
        run: |
          echo "===== Production Logs ====="
          cat /tmp/demo-service.log || true

          echo "===== Verification Logs ====="
          cat /tmp/demo-service-verify.log || true

      # 11. Auto-stop after testing
      - name: Stop services after testing
        if: always()
        run: |
          echo "🛑 Stopping test services..."

          if [ -f /opt/demo-service/app.pid ]; then
            sudo kill "$(cat /opt/demo-service/app.pid)" || true
          fi

          if [ -f /opt/demo-service-verify/app.pid ]; then
            sudo kill "$(cat /opt/demo-service-verify/app.pid)" || true
          fi

          echo "✅ Test services stopped"
