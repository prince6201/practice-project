name: CI

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Verify Java and Maven
      - name: Check Java version
        run: |
          java -version
          ./mvnw -version

      # 4. Build Spring Boot application
      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      # 5. Deploy to Production
      # Swagger stays OFF
      - name: Deploy to Production
        run: |
          sudo cp target/*.jar /opt/demo-service/app.jar
          sudo systemctl restart demo-service

          for i in {1..10}; do
            if curl -f http://localhost:8080/api/hello; then
              echo "✅ demo-service is up (attempt $i)"
              break
            fi

            echo "⏳ Waiting for demo-service... attempt $i"
            sleep 3
          done

          curl -f http://localhost:8080/api/hello || exit 1

      # 6. Deploy to Verification Service
      # Swagger stays ON
      - name: Deploy to Verification Service
        run: |
          sudo cp target/*.jar /opt/demo-service-verify/app.jar
          sudo systemctl restart demo-service-verify

          for i in {1..10}; do
            if curl -f http://localhost:8081/api/hello; then
              echo "✅ demo-service-verify is up (attempt $i)"
              break
            fi

            echo "⏳ Waiting for demo-service-verify... attempt $i"
            sleep 3
          done

          curl -f http://localhost:8081/api/hello || exit 1

      # 7. Schedule auto-stop after 2 minutes
      - name: Schedule auto-stop after 2 minutes
        run: |
          echo "⏰ Scheduling auto-stop in 2 minutes..."

          (
            sleep 120

            echo "🛑 Stopping demo services..."

            sudo systemctl stop demo-service || true
            sudo systemctl stop demo-service-verify || true

            echo "✅ Both demo services stopped."
          ) &

          echo "✅ Auto-stop scheduled successfully."
```
