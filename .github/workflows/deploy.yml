name: CI

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Java 21 setup - fixes "release version 21 not supported"
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Verify Java version
      - name: Check Java version
        run: |
          java -version
          ./mvnw -version

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Deploy to Production (Swagger stays OFF)
        run: |
          sudo cp target/*.jar /opt/demo-service/app.jar
          sudo systemctl restart demo-service

          for i in {1..10}; do
            if curl -f http://localhost:8080/api/hello; then
              echo "✅ demo-service is up (attempt $i)"
              break
            fi

            echo "⏳ Waiting for demo-service... attempt $i"
            sleep 3
          done

          curl -f http://localhost:8080/api/hello || exit 1

      - name: Deploy to Verification Service (Swagger ON)
        run: |
          sudo cp target/*.jar /opt/demo-service-verify/app.jar
          sudo systemctl restart demo-service-verify

          for i in {1..10}; do
            if curl -f http://localhost:8081/api/hello; then
              echo "✅ demo-service-verify is up (attempt $i)"
              break
            fi

            echo "⏳ Waiting for demo-service-verify... attempt $i"
            sleep 3
          done

          curl -f http://localhost:8081/api/hello || exit 1

      - name: Schedule auto-stop after 2 minutes (testing)
        run: |
          echo "⏰ Scheduling auto-stop after 2 minutes..."

          nohup bash -c '
            sleep 120
            echo "🛑 Stopping demo services..."
            sudo systemctl stop demo-service || true
            sudo systemctl stop demo-service-verify || true
            echo "✅ Auto-stop completed."
          ' >/tmp/auto-stop.log 2>&1 &

          echo "✅ Auto-stop scheduled successfully."
