name: Deploy Spring Boot (Self-Hosted Runner)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Deploy to Production (Swagger stays OFF)
        run: |
          sudo cp target/*.jar /opt/demo-service/app.jar
          sudo systemctl restart demo-service
          sleep 5
          curl -f http://localhost:8080/api/hello || exit 1

      - name: Deploy to Verification Service (Swagger ON)
        run: |
          sudo cp target/*.jar /opt/demo-service-verify/app.jar
          sudo systemctl restart demo-service-verify
          sleep 5
          curl -f http://localhost:8081/api/hello || exit 1

      - name: Schedule auto-stop after 2 minutes (testing)
        run: |
          sudo systemctl stop swagger-autostop.service 2>/dev/null || true
          sudo systemd-run --unit=swagger-autostop --on-active=2min \
            /bin/systemctl stop demo-service-verify.service
